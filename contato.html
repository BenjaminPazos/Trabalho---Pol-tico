<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
    <title>Contato</title>
    <link rel="shortcut icon" href="imagens/11341462.png">

    <style>
        .infor {
            font-family: "Oswald", sans-serif;
            color: #194756;
            padding-left: 200px;

            font-size: 22px;
        }

        h1 {
            font-family: "Oswald", sans-serif;

        }

        form {
            width: 700px;
            margin: 30px auto;
            font-family: "Open Sans", sans-serif;
        }

        label {
            font-weight: bold;
            color: #0B3C5D;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 2px solid #008C43;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 2px solid #008C43;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 2px solid #008C43;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 170px;
            background-color: #008C43;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 10px;
            border: none;
        }

        input[type="reset"] {
            width: 170px;
            background-color: #008C43;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 10px;
            border: none;
        }

        input[type="submit"]:hover {
            background-color: #006b34;
        }

        input[type="reset"] {
            background-color: #D4AF37;
        }

        input[type="reset"]:hover {
            background-color: #b69222;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .voltar {
            background-color: #008C43;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: "Open Sans", sans-serif;
            transition: 0.3s;
            margin: 20px;
        }

        .voltar:hover {
            background-color: #006d34;
            color: white;
        }
    </style>
</head>

<body>

    <main class="main">

        <section class="infor">
            <h1>Entre em Contato</h1>
        </section>
        <form action="#" method="post">

            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone"><br><br>

            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade"><br><br>

            <label for="estado">Estado:</label><br>
            <select id="estado" name="estado">
                <option value="">Selecione</option>
                <option>SP</option>
                <option>RJ</option>
                <option>MG</option>
                <option>PR</option>
                <option>SC</option>
                <option>RS</option>
                <option>Outro</option>
            </select><br><br>

            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto">
                <option>Sugestão</option>
                <option>Reclamação</option>
                <option>Dúvida</option>
                <option>Elogio</option>
                <option>Outro</option>
            </select><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="6" cols="50" placeholder="Digite sua mensagem..."
                required></textarea><br><br>

            <input type="checkbox" id="newsletter">
            <label for="newsletter">
                Desejo receber novidades da campanha.
            </label><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

        </form>
        <a href="index.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
    </main>

</body>

</html>
